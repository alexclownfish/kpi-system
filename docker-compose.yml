services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kpi-backend
    restart: unless-stopped
    volumes:
      - kpi-db:/app/db
      - kpi-exports:/app/exports
    environment:
      - SYSTEM_MODE=standalone
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production}
    ports:
      - "13808:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kpi-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "13003:3000"
    depends_on:
      - backend
  nginx-gateway:
    image: nginx:1.26.1
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # 挂载Let's Encrypt证书目录（核心！实现续期自动同步）
      # - /etc/letsencrypt:/etc/letsencrypt
      # 挂载自定义Nginx配置目录
      - ./nginx/conf.d:/etc/nginx/conf.d
      # 挂载Nginx主配置文件
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      # 日志目录（可选，方便排查问题）
      - ./nginx/logs:/var/log/nginx

volumes:
  kpi-db:
  kpi-exports:
