services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: kpi-backend
    restart: unless-stopped
    volumes:
      - kpi-db:/app/db
      - kpi-exports:/app/exports
      - kpi-signoffs:/app/uploads/evaluation-confirmations
    environment:
      - SYSTEM_MODE=standalone
      - GIN_MODE=release
      - JWT_SECRET=${JWT_SECRET:-please-change-this-secret-in-production}
      - SIGNOFF_UPLOAD_DIR=/app/uploads/evaluation-confirmations
      - BOOTSTRAP_SUPER_ADMIN_EMAIL=${BOOTSTRAP_SUPER_ADMIN_EMAIL:-}
    ports:
      - "13808:8080"

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: kpi-frontend
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    ports:
      - "13003:3000"
    depends_on:
      - backend
  nginx-gateway:
    build:
      context: .
      dockerfile: Dockerfile.nginx
    image: kpi-system-nginx:local
    container_name: nginx-gateway
    restart: always
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - frontend

volumes:
  kpi-db:
  kpi-exports:
  kpi-signoffs:
