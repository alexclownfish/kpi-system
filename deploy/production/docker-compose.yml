# Existing PostgreSQL production only. Copy into the runtime directory, edit
# the three application image references, then run: docker compose up -d
# Keep .env, secrets/ and pg-admin-secrets/ in that runtime directory.
name: kpi-system-pg

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${PG_DATABASE:-kpi}
      POSTGRES_USER: ${PG_ADMIN_USER:-kpi_admin}
      POSTGRES_PASSWORD_FILE: /run/kpi-admin-secrets/postgres_admin_password
      KPI_APP_USER: ${PG_USER:-kpi_app}
    volumes:
      - kpi-postgres-data:/var/lib/postgresql/data
      - ./pg-admin-secrets:/run/kpi-admin-secrets:ro
      - ./secrets:/run/kpi-app-secrets:ro
    healthcheck:
      test: ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    logging: *logging

  backend:
    # Replace registry/project and RELEASE in all three application images.
    image: registry.example.com/team/kpi-backend:RELEASE
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      SYSTEM_MODE: standalone
      GIN_MODE: release
      DB_DRIVER: postgres
      PGHOST: postgres
      PGPORT: "5432"
      PGDATABASE: ${PG_DATABASE:-kpi}
      PGUSER: ${PG_USER:-kpi_app}
      PGPASSWORD_FILE: /run/kpi-secrets/postgres_password
      JWT_SECRET: ${JWT_SECRET:?Keep the existing JWT_SECRET in .env}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:?Keep the public origin including its port in .env}
      SEED_HONGXING_CATALOG: ${SEED_HONGXING_CATALOG:-false}
      EVALUATION_WORKFLOW_MODE: ${EVALUATION_WORKFLOW_MODE:-audit}
      SIGNOFF_UPLOAD_DIR: /app/uploads/evaluation-confirmations
      BACKUP_DIR: /app/backups
      # Existing production owner is retained; never bootstrap on an update.
      BOOTSTRAP_ADMIN_EMAIL: ""
      BOOTSTRAP_ADMIN_NAME: ""
      BOOTSTRAP_ADMIN_PASSWORD_FILE: ""
      BOOTSTRAP_SUPER_ADMIN_EMAIL: ""
    volumes:
      - kpi-db:/app/db
      # ExportDir in server/handlers/export.go is ./public/exports.
      - kpi-exports:/app/public/exports
      - kpi-signoffs:/app/uploads/evaluation-confirmations
      - kpi-backups:/app/backups
      - ./secrets:/run/kpi-secrets:ro
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/kpi-server", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    logging: *logging

  frontend:
    image: registry.example.com/team/kpi-frontend:RELEASE
    pull_policy: always
    restart: unless-stopped
    environment:
      NODE_ENV: production
    expose:
      - "3000"
    depends_on:
      backend:
        condition: service_healthy
    logging: *logging

  nginx-gateway:
    image: registry.example.com/team/kpi-nginx:RELEASE
    pull_policy: always
    restart: unless-stopped
    ports:
      - "${KPI_HTTP_BIND:-0.0.0.0}:${KPI_HTTP_PORT:-8088}:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    logging: *logging

# Exact names from production docker inspect. Missing volumes fail startup;
# Compose must not silently create a new empty database or attachment volume.
volumes:
  kpi-postgres-data:
    external: true
    name: kpi-system-pg_kpi-postgres-data
  kpi-db:
    external: true
    name: kpi-system-pg_kpi-db
  kpi-exports:
    external: true
    name: kpi-system-pg_kpi-exports
  kpi-signoffs:
    external: true
    name: kpi-system-pg_kpi-signoffs
  kpi-backups:
    external: true
    name: kpi-system-pg_kpi-backups
